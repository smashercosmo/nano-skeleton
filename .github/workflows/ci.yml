name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow run the same checks before it publishes
  workflow_call:

permissions: {}

# Pull requests: one run per branch, a new push cancels the old run. Everything
# else gets a group of its own (the run id), so runs never wait for each other:
# GitHub cancels a waiting run when a newer one arrives, and a cancelled check
# would silently skip a release. `github.workflow` is the calling workflow's
# name when this one is called from the release workflow
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm from "packageManager" and Node from "devEngines.runtime"
      # in package.json, then runs `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Before type-checking: the apps get nano-skeleton's types from its dist
      - name: Build
        run: pnpm build

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check

      # The browser tests run in Chromium, WebKit and Firefox
      - name: Install browsers
        run: pnpm --filter nano-skeleton exec playwright install --with-deps chromium webkit firefox

      - name: Test
        run: pnpm --filter nano-skeleton test
