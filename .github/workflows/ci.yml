name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm from "packageManager" and Node from "devEngines.runtime"
      # in package.json, then runs `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Before type-checking: the apps get nano-skeleton's types from its dist
      - name: Build
        run: pnpm build

      - name: Lint and type-check
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check

      # The browser tests run in Chromium, WebKit and Firefox
      - name: Install browsers
        run: pnpm --filter nano-skeleton exec playwright install --with-deps chromium webkit firefox

      - name: Test
        run: pnpm --filter nano-skeleton test
