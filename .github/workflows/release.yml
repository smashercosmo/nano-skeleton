name: Release

# The reusable release workflow of smashercosmo/actions. Every push to main
# either opens (or updates) the release PR from the pending change intents, or,
# right after the release PR was merged, runs CI on the commit and stages the
# packages on npm. Approve the staged versions with `pnpm stage approve` (2FA):
# the run of the merge waits up to 10 minutes for that, then publishes the
# GitHub releases, which creates the tags. A version approved later is released
# by the next run. Running it manually (workflow_dispatch) without pending
# intents always takes the release path, e.g. to retry a failed release
#
# Every run then deploys the docs site, apps/docs, to GitHub Pages, built from
# the `v<version>` tag of the released version, so the docs always match npm.
# Nothing is deployed while a version waits for its approval. The github-pages
# environment has to allow deployments from main, where this workflow runs
#
# The npm trusted publisher of nano-skeleton names this file and the `release`
# environment, which has the GitHub App's private key. The client ID is a
# repository variable, as this job can't have an environment
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # The most the jobs of the workflow can get. Each of them asks only for
    # what it needs: publishing the releases needs `contents: write`, staging
    # on npm (OIDC) `id-token: write`, deploying the docs `pages: write` and
    # `id-token: write`
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: smashercosmo/actions/.github/workflows/release.yml@abdfa51294bf4b5da839716d05754ee0b86ed99e # v0.5.0
    with:
      app-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      npm: true
      playwright-browsers: chromium webkit firefox
      # Builds nano-skeleton and the docs site that depends on it with
      # `pnpm --filter docs... build`, and deploys apps/docs/dist
      docs: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
