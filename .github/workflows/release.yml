name: Release

# The reusable release workflow of smashercosmo/actions. Every push to main
# either opens (or updates) the release PR from the pending change intents, or,
# right after the release PR was merged, runs CI on the commit, stages the
# packages on npm and drafts their GitHub releases. Approve the staged versions
# with `pnpm stage approve` (2FA), then publish the drafts, which creates the
# tags. Running it manually (workflow_dispatch) without pending intents always
# takes the release path, e.g. to retry a failed release
#
# The npm trusted publisher of nano-skeleton names this file and the `release`
# environment, which has the GitHub App's private key. The client ID is a
# repository variable, as this job can't have an environment
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # The most the jobs of the workflow can get. Each of them asks only for
    # what it needs: drafting the releases needs `contents: write`, staging on
    # npm (OIDC) `id-token: write`
    permissions:
      contents: write
      id-token: write
    uses: smashercosmo/actions/.github/workflows/release.yml@d283dd6d6b3f5849dfbfea72da2a138dfefc326c # v0.3.0
    with:
      app-client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
      npm: true
      cache: true
      playwright-browsers: chromium webkit firefox
    secrets:
      app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
