name: Deploy docs to GitHub Pages

# Deploys when a release is published, so the docs always match the version
# on npm. The release workflow creates draft releases, and publishing a draft
# (by a person, not a token) triggers this. Running it manually redeploys the
# checked out ref, e.g. a release tag
#
# The github-pages environment must allow deployments from release tags:
# Settings → Environments → github-pages → Deployment branches and tags
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs dependency code during install and build, so it only gets read access
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm from "packageManager" and Node from "devEngines.runtime"
      # in package.json, then runs `pnpm install --frozen-lockfile`. Without the
      # cache the other workflows use: what is built here gets published, and a
      # cache is one more way for something foreign to get into it
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # Builds nano-skeleton first, then the docs site that depends on it
      - run: pnpm --filter docs... build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
