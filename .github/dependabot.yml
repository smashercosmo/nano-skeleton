version: 2

updates:
  # The actions in the workflows are pinned to commit hashes, which nothing
  # else keeps up to date. All updates come in one weekly pull request
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be out for a week before it's proposed, so one that
    # turns out to be broken or malicious is likely to be pulled first. Except
    # for the actions from my own repositories, which are proposed at the next
    # weekly run after their release
    cooldown:
      default-days: 7
      exclude:
        - "smashercosmo/*"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
