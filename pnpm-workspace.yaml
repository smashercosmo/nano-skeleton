packages:
  - apps/*
  - packages/*
  - internal/*
  - .github/actions/*

hoist: false
saveExact: true
catalogMode: strict

versioning:
  changelog:
    # Keep CHANGELOG.md committed in each package; the release workflow
    # builds GitHub release notes from it
    storage: repository

tasks:
  build:
    dependsOn: ["^build"]
    outputs: ["dist/**"]
  dev:
    cache: false
  preview:
    dependsOn: ["^build"]

catalogs:
  actions:
    "@actions/core": 3.0.1
    "@actions/exec": 3.0.0
    "@actions/github": 9.1.1
    "@octokit/auth-app": 8.3.1
    zod: 4.6.7
  ui:
    microlighter: 2.2.0
    react: 19.3.1
    react-dom: 19.3.1
  types:
    "@types/node": 26.6.6
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
  dev:
    astro: 7.4.7
    vite: 8.3.5
    "@vitejs/plugin-react": 6.2.1
    tsdown: 0.23.4
    "@rolldown/plugin-babel": 0.3.0
    babel-plugin-react-compiler: 1.0.0
    oxfmt: 0.76.0
    "@tsdown/css": 0.23.4
    rolldown: 1.2.16
  lint:
    eslint-plugin-regexp: 3.3.3
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
